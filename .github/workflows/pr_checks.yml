on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  pr_checks:
    if: github.repository == 'nf-neuro/website'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      dry-run: true
